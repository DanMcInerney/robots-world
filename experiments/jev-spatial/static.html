<!doctype html><html><meta charset="utf-8"><title>Jev camera interpretation probes</title><style>body{background:#111b29;color:#e2ebf7;font:15px system-ui;margin:30px}a{color:#9dd2ff}select{padding:8px;max-width:95%}img{width:640px;max-width:95%;image-rendering:pixelated}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2a3d;padding:16px;max-height:65vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><h1>Static camera interpretation</h1><p>Real Jev calls on rendered RGB. No physical actions applied; these are component diagnostics, never complete-mission successes.</p><a href="index.html">Campaign index</a><p><select id="sel"></select></p><div class="grid"><div><img id="image"><pre id="score"></pre></div><div><pre id="response"></pre></div></div><h2>Exact observation, mission, state and full questions</h2><pre id="request"></pre><script type="module">
const n=Number(new URLSearchParams(location.search).get('round')??1),base=`round-${String(n).padStart(2,'0')}/probes/`,r=await(await fetch(base+'report.json')).json(),$=id=>document.getElementById(id);$('sel').innerHTML=r.rows.map((x,i)=>`<option value="${i}">${x.id} · ${x.phase}</option>`).join('');function show(){const x=r.rows[Number($('sel').value)];$('image').src=base+x.observation.sensors.camera.value.frame;$('score').textContent=JSON.stringify(x.evaluation,null,2);$('response').textContent=JSON.stringify({response:x.response,mapping:x.mapping,apiLatencyMs:x.latencyMs},null,2);$('request').textContent=JSON.stringify({observation:x.observation,request:x.request},null,2)}$('sel').onchange=show;show();</script></html>
